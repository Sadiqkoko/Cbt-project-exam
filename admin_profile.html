<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Profile</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f6fb;
}
.navbar{
    height:60px;
    background:#007BFF;
    color:white;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 20px;
}
.navbar img{
    width:45px;
    height:45px;
    border-radius:50%;
}
.container{
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}
.profile-header{
    display:flex;
    align-items:center;
    gap:30px;
}
.profile-header img{
    width:140px;
    height:140px;
    border-radius:50%;
    border:4px solid #007BFF;
}
.profile-header h2{
    margin:0;
    color:#007BFF;
}
.info{
    margin-top:30px;
}
.info div{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #eee;
}
.info span{
    font-weight:bold;
    color:#555;
}
.actions{
    margin-top:30px;
    display:flex;
    gap:15px;
}
.actions a{
    text-decoration:none;
    padding:12px 20px;
    background:#007BFF;
    color:white;
    border-radius:6px;
}
.logout{
    background:#dc3545;
}
</style>
</head>
<body>

<div class="navbar">
    <img src="{{ url_for('static', filename='profile_pictures/' + (admin.picture or 'admin.jpg')) }}">
</div>

<div class="container">

    <div class="profile-header">
        <img src="{{ url_for('static', filename='profile_pictures/' + (admin.picture or 'admin.jpg')) }}">
        <div>
            <h2>{{ admin.fullname }}</h2>
            <p>System Administrator</p>
        </div>
    </div>

    <div class="info">
        <div><span>Username</span><p>{{ admin.username }}</p></div>
        <div><span>Email</span><p>{{ admin.email }}</p></div>
        <div><span>Permissions</span><p>{{ admin.permissions }}</p></div>
        <div><span>Created At</span><p>{{ admin.created_at }}</p></div>
    </div>

    <div class="actions">
        <a href="{{ url_for('admin_dashboard') }}">⬅ Dashboard</a>
        <a href="{{ url_for('logout') }}" class="logout">Logout</a>
    </div>

</div>

</body>
</html>
