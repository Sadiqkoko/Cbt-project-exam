<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration - Alhuda Cyber Cafe Academy</title>
<style>
body {font-family: Arial, sans-serif; background:#f4f4f9; margin:0; padding:0;}
.container {width: 90%; max-width: 700px; margin: 50px auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
h2 {text-align:center; color:#333;}
form {display:flex; flex-direction: column;}
label {margin-top:10px;}
input, select {padding:8px; margin-top:5px; border-radius:5px; border:1px solid #ccc;}
input[type="file"] {padding:3px;}
button {margin-top:20px; padding:10px; background:#007BFF; color:white; border:none; border-radius:5px; cursor:pointer;}
button:hover {background:#0056b3;}
.profile-pic {width:100px; height:100px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 10px;}
.flash {background:#d4edda; color:#155724; padding:10px; border-radius:5px; margin-bottom:10px; text-align:center;}
</style>
</head>
<body>
<div class="container">
<h2>Student Registration</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST" enctype="multipart/form-data">
<img src="{{ url_for('static', filename='profile_pictures/default.jpg') }}" class="profile-pic" id="preview">

<label>Profile Picture:</label>
<input type="file" name="profile_picture" onchange="loadFile(event)">

<label>Full Name:</label>
<input type="text" name="fullname" required>

<label>Email:</label>
<input type="email" name="email" placeholder="example@email.com" required>

<label>Date of Birth:</label>
<input type="date" name="dob" required>

<label>Phone Number:</label>
<input type="text" name="phone" required>

<label>NIN:</label>
<input type="text" name="nin" required>

<label>Gender:</label>
<select name="gender" required>
    <option value="">Select Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select>

<label>Country:</label>
<input type="text" name="country" required>

<label>State:</label>
<input type="text" name="state" required>

<label>LGA:</label>
<input type="text" name="lga" required>

<label>Address:</label>
<input type="text" name="address" required>

<label>Faculty:</label>
<select name="faculty" id="faculty" required onchange="populateDepartments()">
    <option value="">Select Faculty</option>
    {% for fac, data in faculties.items() %}
        <option value="{{ fac }}">{{ fac }}</option>
    {% endfor %}
</select>

<label>Department:</label>
<select name="department" id="department" required>
    <option value="">Select Department</option>
</select>

<label>Level:</label>
<select name="level" required>
    <option value="">Select Level</option>
    <option value="100">100</option>
    <option value="200">200</option>
    <option value="300">300</option>
    <option value="400">400</option>
</select>

<label>Session:</label>
<input type="text" name="session" placeholder="2025/2026" required>

<label>Password:</label>
<input type="password" name="password" required>

<label>PIN (4 digits):</label>
<input type="text" name="pin" maxlength="4" required>

<label>Secret Answer (for forgot password):</label>
<input type="text" name="secret_answer" required>

<button type="submit">Register</button>
</form>
</div>

<script>
var faculties = {{ faculties|tojson }};
function populateDepartments(){
    var facSelect = document.getElementById('faculty');
    var deptSelect = document.getElementById('department');
    var selectedFac = facSelect.value;
    deptSelect.innerHTML = '<option value="">Select Department</option>';
    if(selectedFac && faculties[selectedFac]){
        var depts = faculties[selectedFac]['departments'];
        for(var d in depts){
            deptSelect.innerHTML += '<option value="'+d+'">'+d+'</option>';
        }
    }
}

// Profile preview
var loadFile = function(event) {
    var output = document.getElementById('preview');
    output.src = URL.createObjectURL(event.target.files[0]);
};
</script>
</body>
</html>
