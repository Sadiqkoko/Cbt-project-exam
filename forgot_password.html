<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password - Alhuda Cyber Cafe Academy</title>
<style>
body {font-family: Arial, sans-serif; background:#f4f4f9; margin:0; padding:0;}
.container {width: 90%; max-width: 400px; margin: 80px auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
h2 {text-align:center; color:#333;}
form {display:flex; flex-direction: column;}
label {margin-top:10px;}
input {padding:8px; margin-top:5px; border-radius:5px; border:1px solid #ccc;}
button {margin-top:20px; padding:10px; background:#007BFF; color:white; border:none; border-radius:5px; cursor:pointer;}
button:hover {background:#0056b3;}
.flash {background:#d4edda; color:#155724; padding:10px; border-radius:5px; margin-bottom:10px; text-align:center;}
.links {margin-top:10px; text-align:center;}
.links a {color:#007BFF; text-decoration:none;}
.links a:hover {text-decoration:underline;}
</style>
</head>
<body>
<div class="container">
<h2>Forgot Password</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST">
<label>Admission Number / Phone / NIN:</label>
<input type="text" name="identifier" required>

<label>Secret Answer:</label>
<input type="text" name="secret_answer" required>

<label>New Password:</label>
<input type="password" name="new_password" required>

<button type="submit">Request Password Reset</button>
<div class="links">
    <p><a href="{{ url_for('login') }}">Back to Login</a></p>
</div>
</form>
</div>
</body>
</html>
