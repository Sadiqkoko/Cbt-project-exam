<!DOCTYPE html>
<html>
<head>
<title>Reset PIN</title>
<style>
body{font-family:Arial;background:#eef}
.box{width:380px;margin:80px auto;background:#fff;padding:25px;border-radius:10px}
input,button{width:100%;padding:10px;margin-top:10px}
button{background:#28a745;color:white;border:none}
</style>
</head>
<body>
<div class="box">
<h3>Reset Exam PIN</h3>
<form method="POST">
<input name="admission" placeholder="Admission Number" required>
<input name="nin" placeholder="NIN" required>
<input name="new_pin" maxlength="4" placeholder="New 4 Digit PIN" required>
<button type="submit">Reset PIN</button>
</form>
</div>
</body>
</html>
